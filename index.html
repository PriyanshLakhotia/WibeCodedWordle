<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Wibe Coded Wordle. Five letters. Six guesses. A new puzzle whenever you want." />
    <title>Wibe Coded Wordle</title>
    <link rel="icon" type="image/svg+xml" href="/public/favicon.svg" />
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/app.js"></script>
  </head>
  <body>
    <header class="header">
      <nav class="header-side" aria-label="Game controls">
        <button class="icon-button" id="help-button" aria-label="How to play" title="How to play">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 1.8-2.5 1.8-2.5 3.5"/><path d="M12 16h.01"/></svg>
        </button>
        <button class="icon-button" id="new-game-button" aria-label="New game" title="New game">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2 6.3M20 4v7h-7"/></svg>
        </button>
      </nav>
      <h1>Wibe Coded Wordle</h1>
      <nav class="header-side header-side-right" aria-label="Preferences and statistics">
        <button class="icon-button" id="stats-button" aria-label="Statistics" title="Statistics">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14h4v7H4zM10 8h4v13h-4zM16 3h4v18h-4z"/></svg>
        </button>
        <button class="icon-button" id="settings-button" aria-label="Settings" title="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 3-.7 2.5-2.2 1.3-2.5-.6-2.5 4.3 1.8 1.9v2.5l-1.8 1.8 2.5 4.3 2.5-.6 2.2 1.3.7 2.5h5l.7-2.5 2.2-1.3 2.5.6 2.5-4.3-1.8-1.8v-2.5l1.8-1.9-2.5-4.3-2.5.6-2.2-1.3L14.5 3z" transform="translate(0 -1.5) scale(1 .9)"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </nav>
    </header>

    <main class="game" aria-label="Wibe Coded Wordle game">
      <div class="board-area">
        <div id="board" class="board" role="group" tabindex="-1" aria-label="Guess grid. Six rows of five letters."></div>
      </div>
      <div id="keyboard" class="keyboard" aria-label="On-screen keyboard"></div>
      <div class="game-footer">
        <button class="text-button" id="play-again-button" hidden>Play again <span aria-hidden="true">↗</span></button>
      </div>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <div id="announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    <dialog id="modal" aria-labelledby="modal-title">
      <button class="icon-button close-button" id="close-modal" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
      <div id="modal-content"></div>
    </dialog>
  </body>
</html>
